<app-page-header
  title="Entrenadores"
  subtitle="Administra los entrenadores registrados en ActivaFit."
>
  <p-tag
    [value]="rows().length + ' activos'"
    severity="info"
    [rounded]="true"
  />

  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i>
    <span pButtonLabel>Nuevo entrenador</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">
    {{ error() }}
  </p-message>
}

<div class="rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 10"
    [rows]="10"
    dataKey="id"
    tableStyleClass="min-w-3xl"
  >
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>

        <input
          pInputText
          type="search"
          aria-label="Buscar entrenadores"
          placeholder="Buscar por nombre o descripción..."
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>

      @if (filter()) {
        <p class="mt-2 text-xs text-slate-500">
          {{ visibleRows().length }} de {{ rows().length }}
          coinciden con «{{ filter() }}».
        </p>
      }
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="nombre">
          <div class="flex items-center gap-1">
            Nombre
            <p-sort-icon field="nombre" />
          </div>
        </th>

        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-trainer>
      <tr>
        <td>
          <p class="font-medium text-slate-800">
            {{ trainer.nombre }}
          </p>
          <p class="text-xs text-slate-400">
            #{{ trainer.id }}
          </p>
        </td>

        <td class="text-sm text-slate-600">
          {{ trainer.descripcion || '—' }}
        </td>

        <td>
          <app-status-tag [status]="trainer.status" />
        </td>

        <td>
          <div class="flex justify-end gap-1">
            <button
              pButton
              type="button"
              text
              rounded
              severity="secondary"
              icon="pi pi-pencil"
              aria-label="Editar entrenador"
              pTooltip="Editar"
              (click)="openEdit(trainer)"
            ></button>

            <button
              pButton
              type="button"
              text
              rounded
              severity="warn"
              icon="pi pi-ban"
              aria-label="Desactivar entrenador"
              pTooltip="Baja lógica"
              (click)="deactivate(trainer)"
            ></button>

            <button
              pButton
              type="button"
              text
              rounded
              severity="danger"
              icon="pi pi-trash"
              aria-label="Eliminar entrenador"
              pTooltip="Eliminar"
              (click)="remove(trainer)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          @if (filter()) {
            <app-empty-state
              icon="pi pi-search"
              title="Sin coincidencias"
              message="Ningún entrenador coincide con la búsqueda. Borra el filtro para ver todos."
            />
          } @else {
            <app-empty-state
              icon="pi pi-users"
              title="Sin entrenadores activos"
              message="Registra el primer entrenador con el botón «Nuevo entrenador»."
            />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-trainer-form
    [trainer]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="closeDialog()"
  />
</p-dialog>

<p-confirmdialog />

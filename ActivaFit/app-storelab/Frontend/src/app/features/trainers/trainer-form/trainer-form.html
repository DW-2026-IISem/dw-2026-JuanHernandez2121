<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <div>
    <label for="trainer-name" class="mb-1 block text-sm font-medium">
      Nombre del entrenador *
    </label>

    <input
      id="trainer-name"
      pInputText
      formControlName="nombre"
      placeholder="Carlos Rodríguez"
      class="w-full"
    />

    @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
      <p-message severity="error" size="small" variant="simple">
        El nombre es obligatorio y no debe superar los 150 caracteres.
      </p-message>
    }
  </div>

  <div>
    <label for="trainer-description" class="mb-1 block text-sm font-medium">
      Descripción
    </label>

    <textarea
      id="trainer-description"
      pTextarea
      formControlName="descripcion"
      rows="3"
      placeholder="Entrenador especializado en acondicionamiento físico"
      class="w-full"
    ></textarea>
  </div>

  <div>
    <label for="trainer-status" class="mb-1 block text-sm font-medium">
      Estado
    </label>

    <p-select
      [fluid]="true"
      inputId="trainer-status"
      formControlName="status"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
    />
  </div>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
    <button
      pButton
      type="button"
      severity="secondary"
      outlined
      (click)="cancelled.emit()"
    >
      <span pButtonLabel>Cancelar</span>
    </button>

    <button pButton type="submit" [loading]="saving()">
      <i pButtonIcon class="pi pi-check"></i>
      <span pButtonLabel>Guardar</span>
    </button>
  </div>
</form>

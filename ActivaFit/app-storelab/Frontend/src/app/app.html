<!-- Estructura principal de ActivaFit -->
<div class="flex min-h-screen flex-col bg-slate-100">

  <!-- Encabezado superior -->
  <app-header />

  <!-- Zona central: menú lateral y contenido -->
  <div class="flex flex-1">

    <!-- Menú lateral con ancho fijo -->
    <aside class="w-64 shrink-0">
      <app-aside />
    </aside>

    <!-- Contenido principal -->
    <main id="contenido" class="min-w-0 flex-1 p-6">
      <h1 class="text-2xl font-semibold text-slate-900">
        {{ title }}
      </h1>

      <p class="mt-2 text-slate-600">
        Bienvenido a ActivaFit. Sistema de gestión de gimnasio.
      </p>
    </main>

  </div>

  <!-- Pie de página -->
  <app-footer />

</div>
